urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    # Use 0.0 to fall back to the device's physical limit.
    dist_min: 0.0
    dist_max: 0.0
    ip_port: 10940
    serial_port: "/dev/ttyACM0"
    serial_baud: 115200
    laser_frame_id: "lidar"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: false
    publish_multiecho: false
    cluster: 1
    skip: 0
